<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3838"/>
      <stop offset="100%" stop-color="#252323"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E8BC0"/>
      <stop offset="100%" stop-color="#1E699B"/>
    </linearGradient>
    <linearGradient id="hammer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CCCCCC"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bg)" stroke="url(#accent)" stroke-width="12"/>
  <!-- Anvil body -->
  <path d="M140 340 L170 260 L342 260 L372 340 L400 340 Q410 340 410 350 L410 370 Q410 380 400 380 L112 380 Q102 380 102 370 L102 350 Q102 340 112 340 Z" fill="url(#hammer)"/>
  <!-- Anvil top (horn and face) -->
  <path d="M170 260 L170 230 Q170 200 200 200 L312 200 Q342 200 342 230 L342 260 Z" fill="#AAAAAA"/>
  <!-- Anvil horn -->
  <path d="M170 230 L100 220 Q85 218 85 230 L85 240 Q85 252 100 250 L170 248 Z" fill="#999999"/>
  <!-- Hammer head -->
  <rect x="200" y="100" width="112" height="60" rx="10" ry="10" fill="url(#accent)"/>
  <!-- Hammer handle -->
  <rect x="248" y="155" width="16" height="50" rx="4" ry="4" fill="#666666"/>
  <!-- Spark / X marks -->
  <line x1="340" y1="120" x2="370" y2="90" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
  <line x1="370" y1="120" x2="340" y2="90" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
  <line x1="145" y1="140" x2="165" y2="120" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="140" x2="145" y2="120" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <!-- "FX" text -->
  <text x="256" y="458" font-family="sans-serif" font-weight="bold" font-size="72" fill="#1E699B" text-anchor="middle">FX</text>
</svg>
